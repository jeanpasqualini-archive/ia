services:
  app:
    build: ./
    # Capped on purpose: without a limit an OOM takes down the whole Docker VM
    # and the game just dies with exit 137. With one, the Memoire panel shows a
    # real ceiling and the log warns before the kernel steps in.
    mem_limit: 512m
    volumes:
      - "$PWD:/app"
      - "./app/log/:/tmp/log/"
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
      # Forwarded from the host: without them the container sees no terminal
      # capability at all and the renderer falls back to sixteen colours.
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-}"
